{% extends "members/master.html" %}

{% block tab_title %}Edit Member{% endblock %}
{% block page_title %}Edit Member{% endblock %}

{% block content %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  .em-page {
    display: flex;
    justify-content: center;
    padding: 2.5rem 1rem;
    font-family: 'DM Sans', sans-serif;
  }

  .em-card {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06), 0 8px 32px rgba(0,0,0,0.08);
    animation: emSlideUp 0.35s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes emSlideUp {
    from { opacity:0; transform:translateY(18px); }
    to   { opacity:1; transform:translateY(0); }
  }

  /* Header */
  .em-header {
    background: #12122a;
    padding: 1.4rem 1.75rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .em-header-left { display:flex; align-items:center; gap:12px; }

  .em-hicon {
    width:36px; height:36px;
    background: rgba(255,255,255,0.09);
    border-radius: 9px;
    display:flex; align-items:center; justify-content:center;
  }

  .em-hicon svg {
    width:17px; height:17px; stroke:#b8b4f0;
    fill:none; stroke-width:1.8;
    stroke-linecap:round; stroke-linejoin:round;
  }

  .em-header h2 {
    color: #eeeeff;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0;
  }

  /* Member name pill in header */
  .em-member-pill {
    background: rgba(255,255,255,0.08);
    color: #9490c8;
    font-size: 12px;
    font-weight: 500;
    padding: 4px 11px;
    border-radius: 20px;
    letter-spacing: 0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 140px;
  }

  /* Body */
  .em-body {
    padding: 1.75rem 1.75rem 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
  }

  /* Field */
  .em-field { display:flex; flex-direction:column; gap:6px; }

  .em-field label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: #999;
  }

  .em-field input[type="text"],
  .em-field input[type="date"] {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #e2e0db;
    border-radius: 10px;
    background: #faf9f7;
    color: #1a1a2e;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    box-sizing: border-box;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    appearance: none;
    -webkit-appearance: none;
  }

  .em-field input[type="date"] {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: #555;
  }

  .em-field input:focus {
    border-color: #6c63d0;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(108,99,208,0.12);
  }

  /* Two-column row */
  .em-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  /* Input with trailing icon */
  .em-input-wrap { position: relative; }

  .em-input-wrap svg {
    position: absolute;
    right: 13px; top: 50%;
    transform: translateY(-50%);
    width: 14px; height: 14px;
    stroke: #d0cde8; fill: none;
    stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round;
    pointer-events: none;
  }

  .em-input-wrap input { padding-right: 36px; }

  /* Changed indicator */
  .em-field input.em-changed {
    border-color: #c77c14;
    background: #fffaf2;
  }

  .em-field input.em-changed:focus {
    border-color: #c77c14;
    box-shadow: 0 0 0 3px rgba(199,124,20,0.12);
  }

  /* Divider */
  .em-divider { height:1px; background:#ece9e4; }

  /* Footer */
  .em-footer {
    padding: 1.25rem 1.75rem 1.75rem;
    display: flex;
    gap: 10px;
  }

  .em-btn-save {
    flex: 1;
    padding: 11px 20px;
    background: #12122a;
    color: #eeeeff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    font-family: 'DM Sans', sans-serif;
    letter-spacing: 0.02em;
    cursor: pointer;
    display: flex; align-items:center; justify-content:center; gap:8px;
    transition: background 0.15s, transform 0.1s;
  }

  .em-btn-save:hover  { background: #1e1e40; }
  .em-btn-save:active { transform: scale(0.98); }

  .em-btn-save svg {
    width:14px; height:14px; stroke:#b8b4f0;
    fill:none; stroke-width:2.4;
    stroke-linecap:round; stroke-linejoin:round;
  }

  .em-btn-back {
    padding: 11px 16px;
    background: transparent;
    color: #999;
    border: 1px solid #e2e0db;
    border-radius: 10px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    text-decoration: none;
    display: flex; align-items: center;
    transition: all 0.15s;
  }

  .em-btn-back:hover { background:#f4f3f0; color:#555; border-color:#ccc; }

  /* Unsaved changes banner */
  .em-unsaved {
    display: none;
    margin: 0 1.75rem;
    padding: 9px 14px;
    background: #fef6e8;
    border: 1px solid #f5d9a0;
    border-radius: 10px;
    font-size: 12.5px;
    color: #8c5510;
    align-items: center;
    gap: 7px;
    margin-top: 1rem;
  }

  .em-unsaved.visible { display: flex; }

  .em-unsaved svg {
    width: 14px; height: 14px; stroke: #c77c14;
    fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    flex-shrink: 0;
  }

  @media (max-width: 420px) {
    .em-row { grid-template-columns: 1fr; }
    .em-page { padding: 1.5rem 0.5rem; }
  }
</style>

<div class="em-page">
  <div class="em-card">

    <div class="em-header">
      <div class="em-header-left">
        <div class="em-hicon">
          <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </div>
        <h2>Edit Member</h2>
      </div>
      <span class="em-member-pill">{{ member.firstname }} {{ member.lastname }}</span>
    </div>

    <!-- Unsaved changes banner -->
    <div class="em-unsaved" id="em-unsaved">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      You have unsaved changes
    </div>

    <form action="{% url 'edit' member.id %}" method="post">
      {% csrf_token %}

      <div class="em-body">

        <div class="em-row">
          <div class="em-field">
            <label for="em-firstname">First Name</label>
            <div class="em-input-wrap">
              <input type="text" name="firstname" id="em-firstname"
                     value="{{ member.firstname }}"
                     data-original="{{ member.firstname }}">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            </div>
          </div>

          <div class="em-field">
            <label for="em-lastname">Last Name</label>
            <div class="em-input-wrap">
              <input type="text" name="lastname" id="em-lastname"
                     value="{{ member.lastname }}"
                     data-original="{{ member.lastname }}">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            </div>
          </div>
        </div>

        <div class="em-field">
          <label for="em-phone">Phone</label>
          <div class="em-input-wrap">
            <input type="text" name="phone" id="em-phone"
                   value="{{ member.phone }}"
                   data-original="{{ member.phone }}"
                   placeholder="e.g. 0712 345 678">
            <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.86 19.86 0 0 1 3.09 4.18 2 2 0 0 1 5.07 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L9.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </div>
        </div>

        <div class="em-field">
          <label for="em-joined">Joined Date</label>
          <input type="date" name="joined_date" id="em-joined"
                 value="{{ member.joined_date }}"
                 data-original="{{ member.joined_date }}">
        </div>

      </div>

      <div class="em-divider"></div>

      <div class="em-footer">
        <a href="/members/" class="em-btn-back">← Back</a>
        <button type="submit" class="em-btn-save">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          Save Changes
        </button>
      </div>

    </form>
  </div>
</div>

<script>
  (function(){
    var inputs = document.querySelectorAll('[data-original]');
    var banner = document.getElementById('em-unsaved');

    inputs.forEach(function(input){
      input.addEventListener('input', function(){
        var changed = input.value !== input.dataset.original;
        input.classList.toggle('em-changed', changed);
        var anyChanged = Array.from(inputs).some(function(i){
          return i.value !== i.dataset.original;
        });
        banner.classList.toggle('visible', anyChanged);
      });
    });
  })();
</script>
{% endblock %}
