<!--  members\templates\members\add.html-->
{% extends "members/master.html" %}

{% block tab_title %}Add Member{% endblock %}
{% block page_title %}Add Member{% endblock %}

{% block content %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  .am-page {
    display: flex;
    justify-content: center;
    padding: 2.5rem 1rem;
    font-family: 'DM Sans', sans-serif;
  }

  .am-card {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06), 0 8px 32px rgba(0,0,0,0.08);
    animation: amSlideUp 0.35s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes amSlideUp {
    from { opacity:0; transform:translateY(18px); }
    to   { opacity:1; transform:translateY(0); }
  }

  /* Header */
  .am-header {
    background: #12122a;
    padding: 1.4rem 1.75rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .am-header-left { display:flex; align-items:center; gap:12px; }

  .am-hicon {
    width:36px; height:36px;
    background: rgba(255,255,255,0.09);
    border-radius: 9px;
    display:flex; align-items:center; justify-content:center;
  }

  .am-hicon svg {
    width:17px; height:17px; stroke:#b8b4f0;
    fill:none; stroke-width:1.8;
    stroke-linecap:round; stroke-linejoin:round;
  }

  .am-header h2 {
    color: #eeeeff;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0;
  }

  .am-clock {
    color: #6a68a0;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.05em;
  }

  /* Body */
  .am-body {
    padding: 1.75rem 1.75rem 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
  }

  /* Field */
  .am-field { display:flex; flex-direction:column; gap:6px; }

  .am-field label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: #999;
  }

  .am-field input[type="text"],
  .am-field input[type="date"],
  .am-field input[type="tel"] {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #e2e0db;
    border-radius: 10px;
    background: #faf9f7;
    color: #1a1a2e;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    box-sizing: border-box;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    appearance: none;
    -webkit-appearance: none;
  }

  .am-field input[type="date"] {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: #555;
  }

  .am-field input:focus {
    border-color: #6c63d0;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(108,99,208,0.12);
  }

  /* Two-column row */
  .am-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  /* Input with icon */
  .am-input-wrap { position: relative; }

  .am-input-wrap svg {
    position: absolute;
    right: 13px; top: 50%;
    transform: translateY(-50%);
    width: 15px; height: 15px;
    stroke: #ccc; fill: none;
    stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round;
    pointer-events: none;
  }

  .am-input-wrap input { padding-right: 36px; }

  /* Divider */
  .am-divider { height:1px; background:#ece9e4; }

  /* Footer */
  .am-footer {
    padding: 1.25rem 1.75rem 1.75rem;
    display: flex;
    gap: 10px;
  }

  .am-btn-submit {
    flex: 1;
    padding: 11px 20px;
    background: #12122a;
    color: #eeeeff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    font-family: 'DM Sans', sans-serif;
    letter-spacing: 0.02em;
    cursor: pointer;
    display: flex; align-items:center; justify-content:center; gap:8px;
    transition: background 0.15s, transform 0.1s;
  }

  .am-btn-submit:hover  { background: #1e1e40; }
  .am-btn-submit:active { transform: scale(0.98); }

  .am-btn-submit svg {
    width:15px; height:15px; stroke:#b8b4f0;
    fill:none; stroke-width:2.2;
    stroke-linecap:round; stroke-linejoin:round;
  }

  .am-btn-back {
    padding: 11px 16px;
    background: transparent;
    color: #999;
    border: 1px solid #e2e0db;
    border-radius: 10px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    text-decoration: none;
    display: flex; align-items: center;
    transition: all 0.15s;
  }

  .am-btn-back:hover { background:#f4f3f0; color:#555; border-color:#ccc; }

  @media (max-width: 420px) {
    .am-row { grid-template-columns: 1fr; }
    .am-page { padding: 1.5rem 0.5rem; }
  }
</style>

<div class="am-page">
  <div class="am-card">

    <div class="am-header">
      <div class="am-header-left">
        <div class="am-hicon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        </div>
        <h2>Add Member</h2>
      </div>
      <span class="am-clock" id="am-clock"></span>
    </div>

    <form action="/members/add/" method="post">
      {% csrf_token %}

      <div class="am-body">

        <div class="am-row">
          <div class="am-field">
            <label for="am-first">First Name</label>
            <div class="am-input-wrap">
              <input type="text" name="first" id="am-first" placeholder="e.g. Alice">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            </div>
          </div>

          <div class="am-field">
            <label for="am-last">Last Name</label>
            <div class="am-input-wrap">
              <input type="text" name="last" id="am-last" placeholder="e.g. Kamau">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            </div>
          </div>
        </div>

        <div class="am-field">
          <label for="am-phone">Phone</label>
          <div class="am-input-wrap">
            <input type="text" name="phone" id="am-phone" placeholder="e.g. 0712 345 678">
            <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.86 19.86 0 0 1 3.09 4.18 2 2 0 0 1 5.07 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L9.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </div>
        </div>

        <div class="am-field">
          <label for="am-joined">Joined Date</label>
          <div class="am-input-wrap">
            <input type="date" name="joined_date" id="am-joined">
          </div>
        </div>

      </div>

      <div class="am-divider"></div>

      <div class="am-footer">
        <a href="/members/" class="am-btn-back">← Back</a>
        <button type="submit" class="am-btn-submit">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Member
        </button>
      </div>

    </form>
  </div>
</div>

<script>
  (function(){
    function pad(n){ return String(n).padStart(2,'0'); }
    function tick(){
      var d=new Date(), h=d.getHours(), m=d.getMinutes(), s=d.getSeconds();
      var ampm=h>=12?'PM':'AM'; h=h%12||12;
      var el=document.getElementById('am-clock');
      if(el) el.textContent=h+':'+pad(m)+':'+pad(s)+' '+ampm;
    }
    tick(); setInterval(tick,1000);
  })();
</script>
{% endblock %}
